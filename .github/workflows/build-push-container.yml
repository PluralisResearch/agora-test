name: Build and Push Container

# Manual trigger only — run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: "Extra tag to apply (optional — git SHA is always tagged)"
        required: false
        type: string
      push:
        description: "Push to registry? (uncheck to dry-run the build)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase. New GHCR packages are private by default.
  IMAGE_NAME: pluralisresearch/agora-test

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      # Standard runners only guarantee ~14 GB free; this image needs more to build.
      # Free disk on runner that we don't need as the image is already large.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Job summary
        run: |
          {
            echo "### Build result"
            echo ""
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "- **Pushed:** \`${{ inputs.push }}\`"
            echo "- **Tags:**"
            echo '${{ steps.meta.outputs.tags }}' | sed 's|^|  - `|;s|$|`|'
          } >> "$GITHUB_STEP_SUMMARY"
