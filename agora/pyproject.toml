[project]
name = "agora"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "PyYAML",
    "prometheus_client",
    "torch==2.11.0",
    "numpy==2.3.5",
    "scipy>=1.2.1",
    "prefetch_generator>=1.0.1",
    "msgpack>=0.5.6",
    "sortedcontainers",
    "uvloop>=0.14.0",
    "grpcio-tools>=1.33.2",
    "protobuf>=5.29.0",
    "configargparse>=1.2.3",
    "py-multihash>=0.2.3",
    "cryptography>=3.4.6",
    "pydantic>=2.0.0",
    "packaging>=20.9",
    "varint>=1.0.2",
    "base58>=1.0.2",
    "netaddr>=1.3.0",
    "idna>=3.10",
    "py-cid>=0.3.0",
    "requests>=2.32.3",
    "speedtest-cli>=2.1.3",
    "psutil>=7.0.0",
    "omegaconf>=2.3.0",
    "tenacity>=9.1.2",
    "pySmartDL>=1.3.4",
    "setuptools<81.0",
    "redis>=4.0.0",  # TODO: Remove after migration to API facade (PRO-1107)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
