include:
  ./default.yaml

# Model
model_config: 13B_C

# Trainerless W2W data plane
worker_to_worker: true
worker_activation_cache: true
trainerless: true
trainerless_batch_size: 1
trainerless_data_start_timeout: 900.0
trainerless_adaptive_inflight: false
trainerless_max_inflight: 64
trainerless_prefetch_batches: 24
w2w_forward_timeout: 120
w2w_backward_timeout: 240 

pithos_corpus: fineweb_edu_1T
pithos_manifest_identity: 4b5f2bcbfad1aacbb77634f0a41493a7cfa2e1953ea4b80e8258c6402de41dd6
pithos_cache_dir: /tmp/pithos
pithos_cache_budget_bytes: 6442450944
pithos_prefetch_depth: 0
pithos_sequence_length: 4096
pithos_seed: 42

# DHT Configuration
num_handlers: 7
num_stages: 13
num_dht: 14

# Metadata Store
metadata_store_url: https://mcstest.pluralis.ai
metadata_store_compress_requests: true

# Training Coordinator
training_coordinator_config:
  init_args:
    average_state_every: 5
    ghost_phase1_steps: 50
    ghost_phase2_steps: 20
    matchmaking_time: 25.0

# State Averager
state_avg_config:
  init_args:
    clip_grad_norm: 0.2774
    clip_grad_norm_tail: 0.5547
    clip_grad_norm_head: 0.2774
    part_size_bytes: 2097152
    sender_timeout: 10.0
    reducer_timeout: 20.0
    # Requires delta_rule_averaging (enabled in reparam_llama default)
    compression: agora_server.core.averaging.compression.BFloat16Compression

# Training
max_batch_size: {20: 2, 42: 4, 54: 5, 64: 6, 78: 7}
