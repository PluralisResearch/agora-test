[project]
name = "agora_server"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyYAML",
    "prometheus_client",
    "torch==2.11.0",
    "numpy==2.3.5",
    "scipy>=1.2.1",
    "prefetch_generator>=1.0.1",
    "msgpack>=0.5.6",
    "sortedcontainers",
    "uvloop>=0.14.0",
    "grpcio-tools>=1.33.2",
    "protobuf>=5.29.0",
    "py-multihash>=0.2.3",
    "cryptography>=3.4.6",
    "pydantic>=2.0.0",
    "packaging>=20.9",
    "varint>=1.0.2",
    "base58>=1.0.2",
    "netaddr>=1.3.0",
    "idna>=3.10",
    "py-cid>=0.3.0",
    "requests>=2.32.3",
    "httpx>=0.27.0",  # Metadata Store API client (RedisDHT over HTTP, PRO-1107)
    "speedtest-cli>=2.1.3",
    "psutil>=7.0.0",
    "boto3",
    "omegaconf>=2.3.0",
    "tenacity>=9.1.2",
    "redis>=4.0.0",  # TODO: Remove after migration to API facade (PRO-1107)
    # for tests:
    # Cap <2.31: fakeredis 2.31+ regressed RESP3 handling — with server_version=(8,0)
    # its TcpFakeServer returns the RESP3 null marker (b'_') to a RESP2 client, so any
    # miss (e.g. matchmaking get on an absent key) raises "Protocol Error: b'_'",
    # breaking the cross-process tests (test_averaging, test_training_coordinator). 2.30.0 is last good.
    "fakeredis>=2.20.0,<2.31",  # TODO: Remove after migration to API facade (PRO-1107)
]


[build-system]
requires = ["hatchling", "grpcio-tools>=1.33.2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# Compiles proto/*.proto -> *_pb2.py and fetches the p2pd daemon binary
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agora_server"]
artifacts = [
    "src/agora_server/hivemind/proto/*_pb2.py",
    "src/agora_server/hivemind/_bin/p2pd",
]

[tool.hatch.build.targets.wheel.force-include]
"src/agora_server/hivemind/_bin/p2pd" = "agora_server/hivemind/_bin/p2pd"
