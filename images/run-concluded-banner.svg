<svg xmlns="http://www.w3.org/2000/svg" width="760" height="186" viewBox="0 0 760 186" role="img" aria-labelledby="concluded-title concluded-desc">
  <title id="concluded-title">The 13B System Test has concluded</title>
  <desc id="concluded-desc">The 13B System Test is done. Over the course of the run we hit a peak of 370 concurrent GPUs and a max of 255k TPS. We thank all the contributors!</desc>

  <defs>
    <linearGradient id="concluded-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a9eff"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Note panel -->
  <rect x="0.5" y="0.5" width="759" height="185" rx="6" ry="6" fill="#12121a" stroke="#2a2a3a"/>

  <!-- Mono eyebrow -->
  <text x="380" y="38"
        text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
        font-size="10" font-weight="600" letter-spacing="2" fill="#8888a0">ANNOUNCEMENT</text>

  <!-- Title -->
  <text x="380" y="72"
        text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="600" fill="#e0e0e8">The 13B System Test has concluded</text>

  <!-- Accent divider -->
  <rect x="350" y="86" width="60" height="2" rx="1" fill="url(#concluded-accent)"/>

  <!-- Body -->
  <text x="380" y="114"
        text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" fill="#8888a0">The 13B System Test is done. Over the course of the run we hit</text>
  <text x="380" y="134"
        text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="14" fill="#8888a0">a peak of <tspan font-weight="600" fill="#e0e0e8">370 concurrent GPUs</tspan> and a max of <tspan font-weight="600" fill="#e0e0e8">255k TPS</tspan>.</text>

  <!-- Thank you -->
  <text x="380" y="162"
        text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="16" font-weight="600" fill="#e0e0e8">We thank all the contributors!</text>
</svg>
